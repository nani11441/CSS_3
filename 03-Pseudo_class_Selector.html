<!DOCTYPE html>
<html lang="en">

    <title>Pseudo class Selector</title>

<body>
    <!-- Hover -->

    <!-- Focus -->

    <input type="text ">
    <!-- Visited,Active and link -->
    <a href="https://www.amazon.in ">Amazon</a>
    <a href="https://www.flipcart.com ">Flipcart</a>
    <a href="https://www.Mynthra ">Mynthra</a>

    <!-- first -child,last-child,nth-child -->
    <div>
        <p>para 1</p>
        <p>para 2</p>
        <p>para 3</p>
        <p>para 4</p>
        <p>para 5</p>
        <p>para 6</p>
        <p>para 7</p>
        <p>para 8</p>

    <form action="">
        <label for="">Gender:</label><br>
        <input type="radio" name="gender">
        <label for="">Male</label><br>
        <input type="radio" name="gender">
        <label for="">Female</label><br>
        <input type="radio" name="gender">
        <label for="">Others</label>

    <ul>
        <li class="exclude">Nagesh</li>
        <li class="exclude">NANI</li>
        <li>SHIVA</li>
        <li>SAI</li>
        <li id="exclude">VENU</li>
